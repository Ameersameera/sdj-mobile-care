name: Build Windows app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build SDJMobileCare.exe
        run: pyinstaller --noconfirm sdj_mobile_care.spec

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SDJMobileCare\SDJMobileCare.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:TEMP\sdj_selftest.txt"
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\sdj_mobile_care.iss

      - name: Upload app folder
        uses: actions/upload-artifact@v7
        with:
          name: SDJMobileCare-Windows-app
          path: dist/SDJMobileCare

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: SDJMobileCare-Windows-installer
          path: dist/installer/*.exe

      - name: Publish GitHub Release (only for version tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "dist\SDJMobileCare-Windows-app-$tag.zip"
          Compress-Archive -Path dist\SDJMobileCare -DestinationPath $zip
          $setup = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName
          gh release create $tag $setup $zip --title "SDJ Mobile Care $tag" --notes-file docs\RELEASE_NOTES.md
