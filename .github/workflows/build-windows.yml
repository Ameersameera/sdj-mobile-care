name: Build Windows app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build SDJMobileCare.exe
        run: pyinstaller --noconfirm sdj_mobile_care.spec

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SDJMobileCare\SDJMobileCare.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:TEMP\sdj_selftest.txt"
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\sdj_mobile_care.iss

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: SDJMobileCare-Windows-app
          path: dist/SDJMobileCare

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SDJMobileCare-Windows-installer
          path: dist/installer/*.exe
